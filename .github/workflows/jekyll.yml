# This workflow uses actions that are not certified by GitHub.
#
# Specifically, it does not use the `actions/jekyll-build-pages` action.
#
# https://github.com/actions/jekyll-build-pages?tab=readme-ov-file#usage is 
# the official action for deploying Jekyll sites to GitHub Pages.
#

name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Runs at 10:05 UTC (06:05 AM EDT) every day
  schedule:
    - cron: '5 10 * * *'  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.306.0
        with:
          ruby-version: '3.2.6'
          bundler-cache: true
          cache-version: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Jekyll Doctor
        run: bundle exec jekyll doctor
      - name: Lint front matter
        run: python3 scripts/lint-frontmatter.py _posts/ || true
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: HTML Proofer
        run: |
          bundle exec htmlproofer _site \
            --ignore-urls "/fonts.googleapis.com/,/fonts.gstatic.com/,/linkedin.com/,/twitter.com/" \
            --ignore-status-codes "999,403" \
            --no-enforce-https \
            --ignore-missing-alt \
            --allow-missing-href \
            --disable-external
      - name: Validate sitemap URLs
        run: |
          if grep -q 'localhost' ./_site/sitemap.xml; then
            echo "::error::sitemap.xml contains localhost URLs"
            grep 'localhost' ./_site/sitemap.xml | head -5
            exit 1
          fi
          echo "Sitemap OK: all URLs use production domain"
      - name: Validate sitemap entry count
        run: |
          count=$(grep -c '<url>' ./_site/sitemap.xml)
          echo "Sitemap contains $count URLs"
          if [ "$count" -lt 150 ]; then
            echo "::error::Sitemap has only $count entries (expected 150+). Posts may be excluded."
            exit 1
          fi
      - name: Check for missing OG images
        run: |
          missing=0
          for post in _posts/*.md; do
            img=$(grep -m1 "^image:" "$post" | sed 's/^image: *//' | tr -d '"' | tr -d "'")
            if [ -z "$img" ]; then
              continue
            fi
            file="${img#/}"
            if [ ! -f "$file" ]; then
              echo "::warning file=$post::Missing OG image: $file"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing posts are missing OG images. Run: python3 bin/generate-og-images.py"
          else
            echo "OG images OK: all posts have their image files"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

#
# https://github.com/actions/deploy-pages/releases/tag/v5
# https://github.com/actions/upload-pages-artifact/releases/tag/v5
# https://github.com/actions/configure-pages/releases/tag/v6
# https://github.com/actions/checkout/releases/tag/v6
#
# https://github.com/ruby/setup-ruby/releases/tag/v1.306.0
#
