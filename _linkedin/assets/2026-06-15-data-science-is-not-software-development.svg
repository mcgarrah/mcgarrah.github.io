<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="627" fill="#0F0F23"/>
  
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3e" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#grid)"/>
  
  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="627" fill="#f44336"/>

  <!-- The 85% Failure Cliff Chart -->
  <g transform="translate(650, 80)">
    <!-- Chart background -->
    <rect x="0" y="0" width="480" height="380" rx="8" fill="rgba(26,26,46,0.8)" stroke="#2a3a4e" stroke-width="1"/>
    
    <!-- Chart title -->
    <text x="240" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0" text-anchor="middle">Enterprise AI Initiative Outcomes</text>
    
    <!-- Y-axis labels -->
    <text x="45" y="75" font-family="monospace" font-size="11" fill="#7a8899" text-anchor="end">100%</text>
    <text x="45" y="175" font-family="monospace" font-size="11" fill="#7a8899" text-anchor="end">50%</text>
    <text x="45" y="275" font-family="monospace" font-size="11" fill="#7a8899" text-anchor="end">0%</text>
    
    <!-- Grid lines -->
    <line x1="55" y1="70" x2="450" y2="70" stroke="#2a3a4e" stroke-width="0.5"/>
    <line x1="55" y1="170" x2="450" y2="170" stroke="#2a3a4e" stroke-width="0.5"/>
    <line x1="55" y1="270" x2="450" y2="270" stroke="#2a3a4e" stroke-width="1"/>
    
    <!-- The FAILURE bar (85%) — massive, red, dominant -->
    <rect x="80" y="100" width="140" height="170" rx="4" fill="url(#cliffGrad)" opacity="0.9"/>
    <text x="150" y="88" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#f44336" text-anchor="middle">85%</text>
    <text x="150" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">FAIL</text>
    <text x="150" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#7a8899" text-anchor="middle">Never reach</text>
    <text x="150" y="326" font-family="system-ui, sans-serif" font-size="11" fill="#7a8899" text-anchor="middle">production</text>
    
    <!-- The SUCCESS bar (15%) — tiny, green, dwarfed -->
    <rect x="280" y="240" width="140" height="30" rx="4" fill="url(#successGrad)" opacity="0.9"/>
    <text x="350" y="232" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#4CAF50" text-anchor="middle">15%</text>
    <text x="350" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" text-anchor="middle">SUCCEED</text>
    <text x="350" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#7a8899" text-anchor="middle">Deliver</text>
    <text x="350" y="326" font-family="system-ui, sans-serif" font-size="11" fill="#7a8899" text-anchor="middle">measurable ROI</text>
    
    <!-- Source citation -->
    <text x="240" y="365" font-family="system-ui, sans-serif" font-size="10" fill="#5F7389" text-anchor="middle">Sources: RAND Corporation, MIT Sloan, Gartner (2024–2025)</text>
  </g>

  <!-- Title text (left side) -->
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff">If You Manage Data Scientists</text>
  <text x="80" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Like Software Engineers,</text>
  <text x="80" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#f44336">You Are Guaranteeing</text>
  <text x="80" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#f44336">This Failure Rate.</text>

  <!-- Subtext -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="16" fill="#7fb3c8">The SDLC model breaks for machine learning.</text>
  <text x="80" y="424" font-family="system-ui, sans-serif" font-size="16" fill="#7fb3c8">Data science follows the research model — not the sprint model.</text>

  <!-- Footer -->
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="80" y="585" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Michael McGarrah · mcgarrah.org</text>
  <text x="1120" y="585" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="end">2026-06-15</text>
</svg>
