<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#4ecdc4"/>

  <!-- Decorative corner element -->
  <circle cx="1100" cy="100" r="200" fill="#4ecdc4" opacity="0.08"/>
  <circle cx="1150" cy="580" r="120" fill="#4ecdc4" opacity="0.05"/>

  <!-- Icon (code brackets) -->
  <g transform="translate(68, 55) scale(1.2)">
    <text font-family="monospace" font-size="36" fill="#4ecdc4">&lt;/&gt;</text>
  </g>

  <!-- Title -->
    <text x="80" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="white">AI-Generated HTML Reports on</text>
    <text x="80" y="255" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" fill="white">GitHub Pages</text>
    <text x="80" y="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="400" fill="#aaaaaa">A Pattern for Lightweight Dashboards</text>

  <!-- Tags -->
    <rect x="80" y="420" width="100" height="30" rx="15" fill="#4ecdc4" opacity="0.3"/>
    <text x="95" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4ecdc4">ai agents</text>
    <rect x="192" y="420" width="60" height="30" rx="15" fill="#4ecdc4" opacity="0.3"/>
    <text x="204" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4ecdc4">html</text>
    <rect x="264" y="420" width="78" height="30" rx="15" fill="#4ecdc4" opacity="0.3"/>
    <text x="276" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4ecdc4">jekyll</text>
    <rect x="354" y="420" width="120" height="30" rx="15" fill="#4ecdc4" opacity="0.3"/>
    <text x="366" y="440" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#4ecdc4">dashboards</text>

  <!-- Footer: site + date -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#4ecdc4" stroke-opacity="0.3" stroke-width="1"/>
  <text x="80" y="570" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">mcgarrah.org</text>
  <text x="1120" y="570" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" text-anchor="end">2026-07-21</text>

  <!-- Author -->
  <text x="80" y="600" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">Michael McGarrah</text>
</svg>
